name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (HEAD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        # Intentionally shallow: this job scans the current tree (HEAD) only.
        # Leaked values already in git history are handled by rotation per
        # docs/runbooks/credential-rotation.md, not by this gate.
      - name: Run gitleaks
        run: |
          archive="${RUNNER_TEMP}/gitleaks_8.24.3_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" detect --redact --no-git --source . --config .gitleaks.toml --verbose
