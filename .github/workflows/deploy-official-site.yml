# WorkPaw 官网发布：取最新正式 release 元数据 → 核验安装包已由仪式脚本
# （mirror-installers.sh，国内机）就位 COS download/<tag>/（KEEP 轮换）→ Hugo
# 构建静态页 → 页面对象 copy 上传桶根。桶根只 copy 不 sync，
# 绝不触碰 Keygate 更新链路对象（releases/ 前缀）。
# 边界（与仓库 CLAUDE.md 一致）：仅手动从 main 运行；COS 凭据在
# desktop-releases Environment；hugo 与 rclone 版本固定并用官方 checksums 校验；
# 所有 actions 与同仓 build-desktop-release.yml 一致按 SHA+版本注释钉版（P1-7）。
#
# 桶根官网标记（双端契约，P1-8 守卫依赖）：本工作流部署完成后回读桶根
# index.html 并校验 OFFICIAL_SITE_MARKER 存在（deploy 端写入事实的验证）；
# sync-download-site.yml（前代下载站，已冻结）在覆盖桶根前校验同一标记
# （守卫端），防止旧下载站页面覆盖官网入口。两端的标记串必须同改同验。
name: deploy-official-site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-official-site
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.169.0"
  # rclone 钉版直装（apt 源版本随发行版漂移、不可钉版）：当前稳定版
  # v1.76.0（2026-11-06 发布，含安全修复），官方 SHA256SUMS 校验后才装。
  # 升级时与 sync-download-site.yml 的 RCLONE_VERSION 同步更新。
  RCLONE_VERSION: "1.76.0"
  # 官网桶根标记：hugo --minify 不剥除 meta 标签，该串恒在构建产物头部
  # （前 300 字节内）；前代下载站页面（download-site/build-site.sh 渲染）
  # 没有该标记，故可区分桶根归属。与 sync-download-site.yml 共用同一常量。
  OFFICIAL_SITE_MARKER: '<meta name="theme-color" content="#0B1F14">'

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: desktop-releases
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install hugo (pinned) and rclone (pinned, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "/tmp/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "/tmp/hugo_${HUGO_VERSION}_checksums.txt" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          grep "hugo_${HUGO_VERSION}_linux-amd64.tar.gz" "/tmp/hugo_${HUGO_VERSION}_checksums.txt" | (cd /tmp && sha256sum -c -)
          mkdir -p /usr/local/bin && tar -xzf "/tmp/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -C /usr/local/bin hugo
          # rclone 与 hugo 同法：zip 必须存成官方 SHA256SUMS 里的原始文件名，
          # sha256sum -c 才能对上；校验通过才解包安装。
          curl -fsSL --retry 3 -o "/tmp/rclone-v${RCLONE_VERSION}-linux-amd64.zip" "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSL --retry 3 -o "/tmp/rclone-v${RCLONE_VERSION}-SHA256SUMS" "https://downloads.rclone.org/v${RCLONE_VERSION}/SHA256SUMS"
          grep "rclone-v${RCLONE_VERSION}-linux-amd64.zip" "/tmp/rclone-v${RCLONE_VERSION}-SHA256SUMS" | (cd /tmp && sha256sum -c -)
          unzip -o -q "/tmp/rclone-v${RCLONE_VERSION}-linux-amd64.zip" -d /tmp/rclone-dist
          install -m 0755 "/tmp/rclone-dist/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version | head -1

      - name: Deploy official site to COS
        env:
          RCLONE_CONFIG_COS_TYPE: s3
          RCLONE_CONFIG_COS_PROVIDER: TencentCOS
          RCLONE_CONFIG_COS_ACCESS_KEY_ID: ${{ secrets.COS_ACCESS_KEY || secrets.COS_ACCESS_KEY_ID }}
          RCLONE_CONFIG_COS_SECRET_ACCESS_KEY: ${{ secrets.COS_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_COS_ENDPOINT: https://cos.ap-guangzhou.myqcloud.com
          COS_REMOTE: cos:workpaw-1253566621
          COS_PUBLIC_BASE: https://workpaw-1253566621.cos.ap-guangzhou.myqcloud.com
          CACHE_ROOT: ${{ runner.temp }}/cache
          KEEP: "3"
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_SIGNED: "false"
        run: bash official-site/scripts/deploy.sh

      # 双端契约的 deploy 端：部署后回读桶根页面前 2KB（只读），确认官网
      # 标记在位。此断言失败说明 deploy.sh 产物异常，须立即人工核查——
      # sync-download-site 的守卫依赖该标记判定桶根归属。
      - name: Verify official-site marker at bucket root (guard contract)
        env:
          RCLONE_CONFIG_COS_TYPE: s3
          RCLONE_CONFIG_COS_PROVIDER: TencentCOS
          RCLONE_CONFIG_COS_ACCESS_KEY_ID: ${{ secrets.COS_ACCESS_KEY || secrets.COS_ACCESS_KEY_ID }}
          RCLONE_CONFIG_COS_SECRET_ACCESS_KEY: ${{ secrets.COS_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_COS_ENDPOINT: https://cos.ap-guangzhou.myqcloud.com
          COS_REMOTE: cos:workpaw-1253566621
        run: |
          set -euo pipefail
          echo "==> 回读桶根 index.html 前 2KB，校验官网标记（只读）…"
          rclone cat "$COS_REMOTE/index.html" > bucket-root-index.html
          page_head="$(head -c 2048 bucket-root-index.html)"
          rm -f bucket-root-index.html
          if ! printf '%s' "$page_head" | grep -F -q -- "$OFFICIAL_SITE_MARKER"; then
            echo "错误：刚部署的桶根 index.html 前 2KB 不含官网标记（$OFFICIAL_SITE_MARKER）。" >&2
            echo "      官网产物异常或被并发写入覆盖；sync-download-site 守卫依赖此标记，请立即人工核查桶根。" >&2
            exit 1
          fi
          echo "    官网标记在位：桶根 index.html 为官网页面（守卫契约成立）。"
