# WorkPaw Desktop 内网下载站（放 /etc/nginx/conf.d/workpaw-download.conf）
#
# 纯静态：root 即 build-site.sh 的 SITE_ROOT。装包体积大，无 gzip、
# 有 sendfile；历史版本目录开 autoindex 供回退装机浏览。
server {
    listen 80;
    server_name download.workpaw.automan.fun;

    root /srv/workpaw-download;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;

    sendfile on;
    tcp_nopush on;

    location /versions/ {
        autoindex on;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
