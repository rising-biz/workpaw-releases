# WorkPaw Desktop 内网下载站（放 /etc/nginx/conf.d/workpaw-download.conf）
#
# VM 只出页面本身（HTML/CSS/JS，几 KB）；安装包全部由腾讯 COS 公网
# 域名分发（桶公有读），不经过本机流量。root 即 build-site.sh 的 SITE_ROOT。
server {
    listen 80;
    server_name download.workpaw.automan.fun;

    root /srv/workpaw-download;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
